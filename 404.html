<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex, follow" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found | Beaumont Archives</title>
    <script>
      (function () {
        var path = window.location.pathname;
        var base = path.indexOf('/Beaumont/') === 0 ? '/Beaumont' : '';
        var parts = path.replace(/^\/Beaumont\//, '/').split('/').filter(Boolean);
        var file = parts[parts.length - 1] || '';
        var knownFiles = {
          'admin-login.html': true,
          'admin.html': true,
          'index.html': true,
          'catalogue.html': true,
          'collection-services.html': true,
          'about.html': true,
          'journal.html': true,
          'digital-archive.html': true,
          'material-search.html': true
        };
        if (knownFiles[file]) {
          window.location.replace(base + '/' + file + window.location.search + window.location.hash);
          return;
        }
        var cleanRoutes = {
          catalogue: 'catalogue.html',
          articles: 'journal.html',
          'pdf-vault': 'digital-archive-item.html'
        };
        if (parts.length >= 2 && cleanRoutes[parts[0]]) {
          var query = new URLSearchParams(window.location.search);
          query.set('slug', parts[1]);
          window.location.replace(base + '/' + cleanRoutes[parts[0]] + '?' + query.toString() + window.location.hash);
        }
      }());
    </script>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>
  <body>
    <p>Page not found. <a href="/">Return to Beaumont Archives</a>.</p>
  </body>
</html>
