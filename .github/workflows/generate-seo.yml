name: Generate SEO files

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  generate-seo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate sitemap and clean routes
        run: |
          node scripts/generate-instagram-feed.js
          node scripts/generate-seo.js
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}

      - name: Commit generated SEO files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Generate SEO sitemap and clean routes
          file_pattern: sitemap.xml robots.txt seo-routes.json instagram-feed.json catalogue articles pdf-vault
